plugins { id 'com.android.application' }

android {
    namespace 'com.hadi.balap'
    compileSdk 34
    defaultConfig {
        applicationId "com.hadi.balap"
        minSdk 21          // Android 5.0 Lollipop ke atas
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
